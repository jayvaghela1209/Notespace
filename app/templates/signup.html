{% extends "base.html" %} {% block title %}Create account - NoteSpace{% endblock
%} {% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-copy">
      <p class="eyebrow">Start fresh</p>
      <h1>Create your note studio.</h1>
      <p>
        Bring structure to your ideas with a space that feels calm, present, and
        easy to use.
      </p>
    </div>

    <form
      action="{{ url_for('auth.signup') }}"
      method="POST"
      autocomplete="off"
      class="auth-form"
    >
      <div class="field-group">
        <label for="username" class="form-label">Username</label>
        <div class="input-wrap">
          <i data-lucide="user" style="width: 18px; height: 18px"></i>
          <input
            type="text"
            id="username"
            name="username"
            class="form-control"
            placeholder="Choose a username"
            required
            autofocus
          />
        </div>
      </div>

      <div class="field-group">
        <label for="password" class="form-label">Password</label>
        <div class="input-wrap">
          <i data-lucide="shield-check" style="width: 18px; height: 18px"></i>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="Choose a secure password"
            required
            minlength="4"
          />
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full">
        <span>Get started</span>
        <i data-lucide="arrow-right" style="width: 18px; height: 18px"></i>
      </button>
    </form>

    <div class="auth-footer">
      <p>
        Already have an account?
        <a href="{{ url_for('auth.login') }}">Log in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
