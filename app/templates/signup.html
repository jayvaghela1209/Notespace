{% extends "base.html" %}

{% block title %}Create Account - NoteSpace{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon-badge">
                <i data-lucide="user-plus" style="width: 26px; height: 26px;"></i>
            </div>
            <h1>Create Account</h1>
            <p>Join NoteSpace to organize your thoughts effortlessly</p>
        </div>

        <form action="{{ url_for('auth.signup') }}" method="POST" autocomplete="off">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <div class="input-container">
                    <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username" required autofocus>
                    <i data-lucide="user" style="width: 18px; height: 18px;"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-container">
                    <input type="password" id="password" name="password" class="form-control" placeholder="Choose a secure password" required minlength="4">
                    <i data-lucide="shield-check" style="width: 18px; height: 18px;"></i>
                </div>
            </div>

            <button type="submit" class="btn-primary">
                <span>Get Started</span>
                <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
            </button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('auth.login') }}">Log in here</a></p>
        </div>
    </div>
</div>
{% endblock %}
