{% extends "base.html" %}

{% block title %}Sign In - NoteSpace{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon-badge">
                <i data-lucide="lock" style="width: 26px; height: 26px;"></i>
            </div>
            <h1>Welcome Back</h1>
            <p>Sign in to access your secure personal notes</p>
        </div>

        <form action="{{ url_for('auth.login') }}" method="POST" autocomplete="off">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <div class="input-container">
                    <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required autofocus>
                    <i data-lucide="user" style="width: 18px; height: 18px;"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-container">
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                    <i data-lucide="key-round" style="width: 18px; height: 18px;"></i>
                </div>
            </div>

            <button type="submit" class="btn-primary">
                <span>Sign In</span>
                <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('auth.signup') }}">Create account</a></p>
        </div>
    </div>
</div>
{% endblock %}
