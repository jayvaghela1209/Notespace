{% extends "base.html" %} {% block title %}Sign in - NoteSpace{% endblock %} {%
block content %}
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-copy">
      <p class="eyebrow">Welcome back</p>
      <h1>Enter your studio.</h1>
      <p>
        Pick up where you left off with your personal archive of notes and
        ideas.
      </p>
    </div>

    <form
      action="{{ url_for('auth.login') }}"
      method="POST"
      autocomplete="off"
      class="auth-form"
    >
      <div class="field-group">
        <label for="username" class="form-label">Username</label>
        <div class="input-wrap">
          <i data-lucide="user" style="width: 18px; height: 18px"></i>
          <input
            type="text"
            id="username"
            name="username"
            class="form-control"
            placeholder="Enter your username"
            required
            autofocus
          />
        </div>
      </div>

      <div class="field-group">
        <label for="password" class="form-label">Password</label>
        <div class="input-wrap">
          <i data-lucide="key-round" style="width: 18px; height: 18px"></i>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="••••••••"
            required
          />
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full">
        <span>Sign in</span>
        <i data-lucide="arrow-right" style="width: 18px; height: 18px"></i>
      </button>
    </form>

    <div class="auth-footer">
      <p>
        New here? <a href="{{ url_for('auth.signup') }}">Create an account</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
