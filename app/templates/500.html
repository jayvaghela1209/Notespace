{% extends "base.html" %}

{% block title %}Internal Server Error - NoteSpace{% endblock %}

{% block content %}
<div class="error-page-container">
    <div class="error-code">500</div>
    <h2 class="error-title">Internal Server Error</h2>
    <p class="error-desc">Something unexpected happened on our server. Please try refreshing the page or try again later.</p>
    <a href="{{ url_for('auth.home') }}" class="btn-primary" style="width: auto; padding: 0.75rem 1.75rem;">
        <i data-lucide="refresh-cw" style="width: 18px; height: 18px;"></i>
        <span>Back to Home</span>
    </a>
</div>
{% endblock %}
